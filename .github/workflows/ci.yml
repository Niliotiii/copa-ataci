name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Type-check (src + functions)
        run: npm run typecheck
      - name: Testes (Vitest + SQLite)
        run: npm test
      - name: Build de produção
        run: npm run build

  workerd-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar deps do app
        run: npm ci
      - name: Testes no runtime real (workerd + D1)
        run: npm run test:workerd
