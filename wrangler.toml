# Cloudflare Pages + D1 · Copa Ataci
# O frontend (Vite) gera ./dist e as Pages Functions ficam em ./functions.
name = "copa-ataci"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

# Binding do banco D1. O `database_id` real é preenchido após criar o banco:
#   npx wrangler d1 create copa-ataci
# e colar o id retornado aqui. Para dev local (--local) o id não é usado.
[[d1_databases]]
binding = "DB"
database_name = "copa-ataci"
database_id = "269c70b7-595d-4931-bc23-90fc8c25836d"
migrations_dir = "migrations"

# Binding do R2 para as imagens (escudos de times e logos de patrocinadores).
# Crie o bucket uma vez com:
#   npx wrangler r2 bucket create copa-ataci-media
# Em dev local, o wrangler cria um bucket local automaticamente.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "copa-ataci-media"
